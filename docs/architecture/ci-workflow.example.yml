# Ready-to-install template, not an active GitHub workflow.
# Current publication credential lacks workflow scope; captain must install separately.
name: Offline compatibility and contracts
on:
  pull_request:
    branches: [experiment/modular-augmentation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AUTOML_THREADS: '1'
      OPENAI_API_KEY: ''
      OPENAI_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested CPU subset without editing platform requirements
        run: python -m pip install numpy==1.26.4 scipy==1.12.0 pandas==2.2.3 scikit-learn==1.5.2 lightgbm==4.6.0 catboost==1.2.8 xgboost-cpu==2.1.4 openai==1.68.2 psutil==6.1.1
      - run: python tests/test_v2.py
      - run: python tests/test_resilience.py
      - run: python tests/test_data_policy.py
      - run: python tests/test_architecture.py
      - run: python tests/smoke.py
      - run: python tools/build_submission.py --output dist/ci.zip
      - run: python tools/verify_release.py --archive dist/ci.zip --output dist/verification.json
